<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>🧪 Test Koneksi Supabase</h2>
    <div id="result">⏳ Menguji koneksi...</div>
    <div id="data" style="margin-top:20px;"></div>

    <script>
        // KONFIGURASI SUPABASE
        const SUPABASE_URL = 'https://vmfkighwxdencihglaei.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtZmtpZ2h3eGRlbmNpaGdsYWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjE2NTUsImV4cCI6MjEwNDA5NzY1NX0.8ErYoCFK5t8HDuuCl3fw4wFdSI-3BqniXmIxjSXVCVQ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function testConnection() {
            const result = document.getElementById('result');
            const dataDiv = document.getElementById('data');

            try {
                result.textContent = '⏳ Mencoba koneksi ke Supabase...';
                result.style.color = 'orange';

                // TEST 1: Coba akses tabel tabungan
                const { data, error } = await supabase
                    .from('tabungan')
                    .select('*')
                    .limit(5);

                if (error) {
                    // Cek error spesifik
                    if (error.message.includes('relation "tabungan" does not exist')) {
                        result.innerHTML = '❌ Tabel "tabungan" BELUM DIBUAT! <br> Jalankan SQL di Supabase dulu.';
                        result.style.color = 'red';
                        dataDiv.innerHTML = `
                            <p><strong>Error:</strong> ${error.message}</p>
                            <p><strong>Solusi:</strong> Jalankan SQL di bawah di SQL Editor Supabase:</p>
                            <pre style="background:#f4f4f4;padding:10px;border-radius:5px;overflow:auto;">
CREATE TABLE IF NOT EXISTS tabungan (
    id BIGSERIAL PRIMARY KEY,
    keterangan TEXT,
    nominal INTEGER,
    tipe TEXT CHECK (tipe IN ('masuk', 'keluar')),
    nama_murid TEXT,
    hari_key TEXT,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

ALTER TABLE tabungan DISABLE ROW LEVEL SECURITY;

INSERT INTO tabungan (keterangan, nominal, tipe, nama_murid, hari_key) 
VALUES ('Test', 10000, 'masuk', 'Budi', '2026-09-05|Hari 1');
                            </pre>
                        `;
                        return;
                    }

                    if (error.message.includes('Invalid API key')) {
                        result.innerHTML = '❌ API Key SALAH! Periksa konfigurasi.';
                        result.style.color = 'red';
                        dataDiv.innerHTML = `<p><strong>Error:</strong> ${error.message}</p>`;
                        return;
                    }

                    throw error;
                }

                // TEST BERHASIL
                result.innerHTML = '✅ Koneksi BERHASIL! Supabase bisa diakses.';
                result.style.color = 'green';

                if (data && data.length > 0) {
                    dataDiv.innerHTML = `
                        <h3>📊 Data di tabel "tabungan" (${data.length} data):</h3>
                        <pre style="background:#f4f4f4;padding:10px;border-radius:5px;overflow:auto;">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    dataDiv.innerHTML = `
                        <h3>📊 Tabel "tabungan" ada tapi masih KOSONG!</h3>
                        <p>Coba tambahkan data:</p>
                        <pre style="background:#f4f4f4;padding:10px;border-radius:5px;overflow:auto;">
INSERT INTO tabungan (keterangan, nominal, tipe, nama_murid, hari_key) 
VALUES ('Uang saku', 20000, 'masuk', 'Budi', '2026-09-05|Hari 1');
                        </pre>
                    `;
                }

            } catch (error) {
                result.innerHTML = `❌ Error: ${error.message}`;
                result.style.color = 'red';
                dataDiv.innerHTML = `<p><strong>Error detail:</strong> ${error.message}</p>`;
                console.error(error);
            }
        }

        // Jalankan test
        testConnection();
    </script>
</body>
</html>
